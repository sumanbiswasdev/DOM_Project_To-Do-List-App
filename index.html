<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/output.css" rel="stylesheet">
  <link rel="shortcut icon" href="/logo.png" type="image/x-icon">
  <title>To do list</title>
</head>
<body class="font-poppins">
  
  
  <div class="bg-gray-100 flex justify-center items-center h-screen">

    <div class="bg-white p-6 rounded-sm shadow-sm w-[450px]">
      <h1 class="text-center text-2xl font-bold mb-5">My Todo List</h1>

      <input id="taskInput" class="w-full p-2 rounded-md mb-3 focus:outline-blue-400 border-[0.1rem]" 
            type="text" placeholder="Enter your task...">

      <div class="flex items-center gap-6 mt-5 text-white text-lg font-light">
        
        <button onclick="addTask()" class="bg-blue-500 w-96 rounded-md p-3 cursor-pointer hover:bg-blue-600 hover:transform hover:transition-all hover:ease-in-out hover:duration-300">Add</button>
        <button onclick="deleteChecked()" class="bg-red-500 w-96 rounded-md p-3 cursor-pointer hover:bg-red-600 hover:transform hover:transition-all hover:ease-in-out hover:duration-300">Delete Checked</button>
      </div>

      <ul id="taskList" class="mt-4 space-y-2"></ul>

    </div>

    
  </div>


    <script src="/script.js"></script> 
</body>
</html>
